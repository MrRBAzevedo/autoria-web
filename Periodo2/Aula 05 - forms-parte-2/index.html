<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FORMULÁRIOS</title>
        <style>
            form{
                border: 1px solid black;
                margin: 2rem auto;
                padding: 2rem;
                width: 20rem;
            }
            label[for]{
                /* selecionar apenas as label's que tem o 'for' definido (o atributo), isto é,
                as label's usadadas com o input 'radio' não serão diagramadas, pois
                não precisam */
                display: inline-block;
                width: 7rem;
                vertical-align: top;
            }
        </style>
    </head>
    <body>
        <h1>FORMULÁRIOS</h1>

        <h2>CONTATO</h2>
        <form action="">
            <label for="nome">Nome: </label>
            <input type="text" id="nome" value="Teste" placeholder="Digite seu nome"> <br>
            <!-- O id das marcações input será útil para o backend, pois ela é resposável por
            guardar o valor fornecido pelo usuário -->
            <!-- 
            'placeholder' é um rótulo dentro do input 
            'disabled' (comando, porque não tem valor) desativa o componente
            'required' que torna obrigatório o campo
            'value' é um atributo importante para a função de edição de dados, por exemplo
            quando vamos atualizar os dados de cadastro
            -->

            <label for="email">E-mail: </label>
            <input type="email" id="email"> <br>

            <label for="motivo">Motivo: </label>
            <select id="motivo">
                <option value="reclamacao">Reclamação</option>
                <option value="elogio" selected>Elogio</option>
                <option value="sugestao">Sugestão</option>
            </select> <br>
            <!-- 
            COMBOBOX
            Componente que permite juntar vários itens em um espaço pequeno. Porém,
            os usuários precisam clicar 2 vezes para seleciona, por iso, é usado
            para um grupo de itens muito similares como lista de estados, meses, anos,
            dias do mês, entre outros.
            O comando 'selected' já deixa um opção visível
            -->

            <label for="mensagem">Mensagem: </label>
            <textarea id="mensagem" style="resize: none;">O 'value' do textarea fica dentro da marcação!</textarea>
            <!-- O textarea tem um funcionamento semelhante ao input, mas é utilizado para
            textos maiores
            Curisodidade: o textarea é uma das únicas marcações do html com abertura e fechamento
            que podem permanecer vazias (semanticamente falando). No entanto, esse espaço pode ser
            utilizado para se pôr o value -->

            <input type="submit" value="ENVIAR">
        </form>

        <h2>BUSCA</h2>
        <form action="">
            <label for="busca">Busca: </label> <br>
            <input type="search" id="busca"> <br>
            <!-- Há um input do tipo pesquisa, é similar ao text visualmente -->
            <input type="submit" value="PESQUISAR">
        </form>
        <!-- 
        Uma página pode ter vários formulários: login, cadastro, enquete, busca...
        cada um deve ter um form, input e submit
        -->

        <h2>ENQUETE</h2>
        <form action="">
            <p>Qual sua disciplina favorita?</p>
            <label><input type="radio" checked name="disc" value="autoria"> Autoria Web</label> <br>
            <label><input type="radio" name="disc" value="prog"> Programação</label> <br>
            <label><input type="radio" name="disc" value="filosofia"> Filosofia</label> <br>
            <label><input type="radio" name="disc" value="design"> Design</label> <br>
            <label><input type="radio" name="disc" value="matematica"> Matemática</label> <br>
            <!-- 
            - Os atributos nas marcações não precisam seguir ordem.
            - O comando 'checked' deixa uma opção marcada 
            - Componente 'radio1 que só permite um item selecionado
            - É necessário colocar o atributo 'name' de todos os itens do grupo iguais
            -->


            <input type="submit" value="ENVIAR">
        </form>
    </body>
</html>
