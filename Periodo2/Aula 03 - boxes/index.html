<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BOXES</title>
        <style>
            div, span, section, h1, p, b, a, code, mark{
                background-color: aquamarine;
                display: inline;
            }
        </style>
    </head>
    <body>
        <!-- o código não tem semântica hoje -->
        <div>BLOCK - MARCAÇÃO DE DIV</div>
        <span>INLINE - MARCAÇÃO DE SPAN</span>
        <section>BLOCK - MARCAÇÃO DE SECTION</section>
        <h1>BLOCK - MARCAÇÃO DE H1</h1>
        <p>BLOCK - MARCAÇÃO DE PARÁGRAFO</p>
        <a href="marcacoesinline.html">INLINE - MARCAÇÃO</a>
        <b>INLINE - MARCAÇÃO DE B (negrito)</b>
        <code>INLINE - MARCAÇÃO DE CODE</code>
        <mark>INLINE - MARKação</mark>
        <!--
            Comportamento nativo:
            MARCAÇÕES BLOCK: ocupam o bloco todo
            MARCAÇÕES INLINE: ocupam apenas os seus caracteres 
        -->
    </body>
</html>
