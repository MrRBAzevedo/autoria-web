<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FORMULÁRIO</title>
    </head>
    <body>
        <form action="">
            <fieldset>
                <legend>Endereço</legend>
                <label for="cidade">Cidade: </label>
                <input type="text" id="cidade" list="listacidade"> <br>
                <!-- 
                componente datalist permite selecionar uma opção ou digitar o texto
                É similar ao "select", porém é mais permissível
                -->
                <datalist id="listacidade">
                    <option value="Natal">
                    <option value="Recife">
                    <option value="João Pessoa">
                </datalist>
            </fieldset>
            <fieldset>
                <!-- O fieldset é um componente para organizar os campos do formulário...
                é totalmente opcional (funciona como o section do formulário) -->
                <legend>Áreas de interesse</legend>
                <label>
                    <input type="checkbox" name="interesse" id="design" valeu="design">
                    <!-- 
                    Componente de checkbox é similar ao 'radio' em relação à sintaxe, porém,
                    permite selecionar vários itens.
                    Também precisa definir o name, o id e o value.
                    -->
                    Design
                </label> <br>
                <label>
                    <input type="checkbox" name="interesse" id="desenvolvimento" value="desenvolvimento">
                    Desenvolvimento
                </label> <br>
                <label for="data">Data de conclusão de curso: </label>
                <input type="date" id="data"> <br>

                <label for="curriculo">Currículo: </label>
                <input type="file" id="curriculo">
                <!-- 
                Componente que permite anexar um arquivo.
                A restrição do tipo de arquivo deve ser feita com JavaScript.
                -->
            </fieldset>
            <input type="submit" value="ENVIAR">
        </form>
    </body>
</html>
