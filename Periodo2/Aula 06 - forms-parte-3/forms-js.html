<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <label>Primeiro número: <input type="text" id="num1"></label> <br>
        <label>Segundo número: <input type="text" id="num2"></label> <br>
        <button id="operador">Multiplicar</button>
        <p id="resultado"></p>

        <script>
            // O JS deve ser feito depois do HTML, pois se utiliza o que é criado neste
            alert('Olá, mundo!'); // Janela de alerta - não usar porque é chata!
            // document.write('Olá, mundo com write!'); // Não usar porque é defasada!
            console.log('Olá, mundo no console!'); // Aí sim! É a forma PROFISSIONAL de envio de mensagem
            // document.getElementById('resultado').innerHTML = 'Olá, mundo com innerHTML'; 
            // Também é indicado! O innerHTML insere um html dentro da marcação com id 'resultado'

            const botao = document.getElementById('operador');
            // Pegando a marcação de button com id 'dobro'

            botao.addEventListener("click", function(e){
                // cria um evento de click no botão
                const num1 = document.getElementById("num1").value;
                const num2 = document.getElementById("num2").value;
                document.getElementById('resultado').innerHTML = num1 * num2;
            })
        </script>
    </body>
</html>
